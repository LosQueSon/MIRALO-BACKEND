name: Deploy to Azure

on:
  push:
    branches: ["*"]

env:
  REGISTRY: ghcr.io
  AZURE_APP_NAME: watch-parties-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
  
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase repo name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
      
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
      
      - name: Show Backend URL
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "🔗 BACKEND API:"
          echo "   https://${{ env.AZURE_APP_NAME }}.azurewebsites.net"
          echo ""
          echo "📺 Endpoints:"
          echo "   GET  https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/rooms"
          echo "   GET  https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/rooms/:roomId/watch-state"
          echo "   PATCH https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/rooms/:roomId/watch-state"
          echo ""
          echo "📡 WebSocket:"
          echo "   wss://${{ env.AZURE_APP_NAME }}.azurewebsites.net/ws/rooms/:roomId/watch?userId=:userId"
          echo ""
          echo "=========================================="
