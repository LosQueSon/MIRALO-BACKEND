name: Build, Test and Deploy

on:
  push:
    branches:
      - main
      - featureScreen
  pull_request:
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build_test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/featureScreen'
    environment:
      name: Production
      url: https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: .

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: "watch-parties-app"
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: "."
