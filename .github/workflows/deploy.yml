name: Build and Test Node.js Application

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-report
          path: coverage/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: 'Production'
      url: https://watch-parties-app.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install and Build
        run: |
          npm ci
          npm run build
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'watch-parties-app'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: '.'
      - name: Backend URLs
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "🔗 BACKEND API:"
          echo "   https://watch-parties-app.azurewebsites.net"
          echo ""
          echo "📺 Endpoints:"
          echo "   GET  https://watch-parties-app.azurewebsites.net/rooms"
          echo "   GET  https://watch-parties-app.azurewebsites.net/rooms/:roomId/watch-state"
          echo "   PATCH https://watch-parties-app.azurewebsites.net/rooms/:roomId/watch-state"
          echo ""
          echo "📡 WebSocket:"
          echo "   wss://watch-parties-app.azurewebsites.net/ws/rooms/:roomId/watch?userId=:userId"
          echo ""
          echo "=========================================="
