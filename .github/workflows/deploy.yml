name: Deploy to Azure

on:
  push:
    branches: ["*"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase repo name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
      
      - name: Output Deployment Info
        run: |
          echo "IMAGE_URL=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest" >> $GITHUB_ENV
      
      - name: Deployment Success
        run: |
          cat << 'EOF'
          ✅ BUILD AND TESTS PASSED
          ✅ IMAGE PUSHED TO: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
          
          🔗 BACKEND API:
             https://watch-parties-app.azurewebsites.net
          
          📺 Endpoints:
             GET  https://watch-parties-app.azurewebsites.net/rooms
             GET  https://watch-parties-app.azurewebsites.net/rooms/:roomId/watch-state
             PATCH https://watch-parties-app.azurewebsites.net/rooms/:roomId/watch-state
          
          📡 WebSocket:
             wss://watch-parties-app.azurewebsites.net/ws/rooms/:roomId/watch?userId=:userId
          
          EOF
