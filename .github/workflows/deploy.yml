name: Build, Test and Deploy

on:
  push:
    branches:
      - main
      - featureScreen
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/featureScreen'
    environment:
      name: 'Production'
      url: https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install and Build
        run: |
          npm ci
          npm run build
      
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'watch-parties-app'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: '.'
      
      - name: Deployment Success
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "🔗 BACKEND API:"
          echo "   https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net"
          echo ""
          echo "📺 Endpoints:"
          echo "   GET  https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net/rooms"
          echo "   GET  https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net/rooms/:roomId/watch-state"
          echo "   PATCH https://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net/rooms/:roomId/watch-state"
          echo ""
          echo "📡 WebSocket:"
          echo "   wss://watch-parties-app-ebamf8g6fuaecth3.eastus-01.azurewebsites.net/ws/rooms/:roomId/watch?userId=:userId"
          echo ""
          echo "Share these URLs with your frontend team!"
          echo "=========================================="
